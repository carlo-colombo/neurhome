name: Build

# Least privilege by default; the build/release job opts into contents: write
# below so it can push the build tag and create the GitHub release.
permissions:
  contents: read

on:
  push:
    branches:
      - 'main'
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Bump version and push tag
        id: bump_and_tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # if you don't want to set write permissions use a PAT token
          WITH_V: false
          PRERELEASE: true
          PRERELEASE_SUFFIX: build
          INITIAL_VERSION: 1.0.0

      - name: Set Up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle

      - name: Assemble APK
        run: |
              ./gradlew \
                -Pandroid.versionName=${{steps.bump_and_tag.outputs.new_tag}} \
                assembleProdRelease

      - name: Validate prod variant before signing
        # `assembleProdRelease` above already runs R8 minification, resource
        # shrinking and lintVitalProdRelease, but nothing in this workflow
        # exercises the prod flavor's unit tests or the release variant's full
        # lint, so a release-only breakage would reach the signing step. AGP 9
        # only creates unit-test tasks for the tested build type (`debug`), so
        # there is no `:app:testProdReleaseUnitTest` and no `:app:lintRelease`
        # alias; `:app:testProdDebugUnitTest` and `:app:lintProdRelease` are the
        # tasks that exist for the prod flavor and the release build type.
        run: |
              ./gradlew \
                -Pandroid.versionName=${{steps.bump_and_tag.outputs.new_tag}} \
                :app:testProdDebugUnitTest \
                :app:lintProdRelease

      - name: Resolve build-tools version from the SDK
        id: build_tools
        # The signing step below shells out to <sdk>/build-tools/<version>/apksigner
        # and zipalign. It used to be r0adkll/sign-android-release, which defaulted
        # to the literal 34.0.0, a version this project does not control (it
        # compiles against SDK 37). A past run failed because those pinned
        # build-tools were missing from the runner image, so resolve the highest
        # installed version instead of hard-coding one.
        #
        # Consequence: signing now follows the runner image's newest build-tools
        # (37.x today), so an image rollover can change apksigner/its defaults
        # without any change in this repository. That is accepted because the
        # alternative - a literal version - has already broken a release. The
        # loop below already guards against a partially installed (or
        # otherwise apksigner-less) newest directory: it only accepts a version
        # whose apksigner is present and executable, so such a directory is
        # skipped rather than signed with.
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root/build-tools" ]; then
            echo "::error::No Android SDK build-tools directory (ANDROID_SDK_ROOT='${ANDROID_SDK_ROOT:-}' ANDROID_HOME='${ANDROID_HOME:-}')"
            exit 1
          fi
          # Highest installed version that actually ships apksigner, so a
          # partially installed or file entry in build-tools cannot break signing.
          version=""
          while IFS= read -r candidate; do
            if [ -x "$sdk_root/build-tools/$candidate/apksigner" ]; then
              version="$candidate"
              break
            fi
          done < <(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -Vr)
          if [ -z "$version" ]; then
            echo "::error::No build-tools directory under $sdk_root/build-tools contains apksigner"
            exit 1
          fi
          echo "Signing with build-tools $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Sign Android release
        id: sign_app
        # Replaces r0adkll/sign-android-release, which was SHA-pinned but
        # unmaintained and emitted the deprecated `::set-output` command on every
        # release run. The steps and the produced filename are the same as the
        # action's, so the rename/checksum/upload/release steps are unchanged:
        #   1. decode the SIGNING_KEY secret into a keystore file
        #   2. zipalign the unsigned APK to app-prod-release-unsigned-aligned.apk
        #   3. `apksigner sign --ks <keystore> --out app-prod-release-unsigned-signed.apk`
        #   4. `apksigner verify` the result
        # The action only ran `zipalign -c` (an alignment check) and copied the
        # APK, relying on AGP having aligned it already; aligning to a real
        # output file here is at least as aligned and cannot regress.
        # `--key-pass` is deliberately not passed, exactly like the action unless
        # its optional keyPassword input was set (this workflow never set it), so
        # no secret beyond the existing three is required.
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          # The build-tools version resolved from the installed SDK above.
          BUILD_TOOLS_VERSION: ${{ steps.build_tools.outputs.version }}
        run: |
          set -euo pipefail
          release_dir="app/build/outputs/apk/prod/release"
          unsigned_apk="$release_dir/app-prod-release-unsigned.apk"
          aligned_apk="$release_dir/app-prod-release-unsigned-aligned.apk"
          signed_apk="$release_dir/app-prod-release-unsigned-signed.apk"
          if [ ! -f "$unsigned_apk" ]; then
            echo "::error::No unsigned release APK at $unsigned_apk"
            exit 1
          fi
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          build_tools="$sdk_root/build-tools/$BUILD_TOOLS_VERSION"
          for tool in zipalign apksigner; do
            if [ ! -x "$build_tools/$tool" ]; then
              echo "::error::$build_tools/$tool is missing or not executable"
              exit 1
            fi
          done

          # Keep the decoded keystore out of the workspace and readable by the
          # runner user only.
          umask 077
          keystore="$(mktemp "${RUNNER_TEMP:-/tmp}/neurhome-keystore.XXXXXX")"
          trap 'rm -f "$keystore" "$aligned_apk"' EXIT
          # Strip whitespace first: `base64 -d` tolerates newlines but exits
          # non-zero on a stray carriage return in the secret, which the action
          # this replaces (a Node base64 decoder) silently ignored.
          printf '%s' "$SIGNING_KEY" | tr -d '[:space:]' | base64 -d > "$keystore"
          if [ ! -s "$keystore" ]; then
            echo "::error::SIGNING_KEY did not decode to a keystore"
            exit 1
          fi

          "$build_tools/zipalign" -f -p 4 "$unsigned_apk" "$aligned_apk"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KEY_STORE_PASSWORD" \
            --out "$signed_apk" \
            "$aligned_apk"
          "$build_tools/apksigner" verify --verbose "$signed_apk"

          # Exposed for the rename step below; the path (and therefore the
          # filename the release steps depend on) is unchanged.
          echo "signed_apk=$signed_apk" >> "$GITHUB_OUTPUT"
      - name: Rename release
        run: mv "${{ steps.sign_app.outputs.signed_apk }}" neurhome-${{steps.bump_and_tag.outputs.new_tag}}.apk
      - name: Generate release checksum
        run: sha256sum neurhome-${{steps.bump_and_tag.outputs.new_tag}}.apk > neurhome-${{steps.bump_and_tag.outputs.new_tag}}.apk.sha256
      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: neurhome-prod-release
          path: |
            neurhome-${{steps.bump_and_tag.outputs.new_tag}}.apk
            neurhome-${{steps.bump_and_tag.outputs.new_tag}}.apk.sha256
          retention-days: 90
      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{steps.bump_and_tag.outputs.new_tag}}
          files: |
            neurhome-${{steps.bump_and_tag.outputs.new_tag}}.apk
            neurhome-${{steps.bump_and_tag.outputs.new_tag}}.apk.sha256
