name: Build

# Least privilege by default; the build/release job opts into contents: write
# below so it can push the build tag and create the GitHub release.
permissions:
  contents: read

on:
  push:
    branches:
      - 'main'
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Bump version and push tag
        id: bump_and_tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # if you don't want to set write permissions use a PAT token
          WITH_V: false
          PRERELEASE: true
          PRERELEASE_SUFFIX: build
          INITIAL_VERSION: 1.0.0

      - name: Set Up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle

      - name: Assemble APK
        run: |
              ./gradlew \
                -Pandroid.versionName=${{steps.bump_and_tag.outputs.new_tag}} \
                assembleProdRelease

      - name: Validate prod variant before signing
        # `assembleProdRelease` above already runs R8 minification, resource
        # shrinking and lintVitalProdRelease, but nothing in this workflow
        # exercises the prod flavor's unit tests or the release variant's full
        # lint, so a release-only breakage would reach the signing step. AGP 9
        # only creates unit-test tasks for the tested build type (`debug`), so
        # there is no `:app:testProdReleaseUnitTest` and no `:app:lintRelease`
        # alias; `:app:testProdDebugUnitTest` and `:app:lintProdRelease` are the
        # tasks that exist for the prod flavor and the release build type.
        run: |
              ./gradlew \
                -Pandroid.versionName=${{steps.bump_and_tag.outputs.new_tag}} \
                :app:testProdDebugUnitTest \
                :app:lintProdRelease

      - name: Resolve build-tools version from the SDK
        id: build_tools
        # `sign-android-release` shells out to <sdk>/build-tools/<version>/apksigner
        # and defaults to the literal 34.0.0, which is not a version this project
        # controls (it compiles against SDK 37). A past run failed because the
        # pinned build-tools were missing from the runner image, so resolve the
        # highest installed version instead of hard-coding one.
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root/build-tools" ]; then
            echo "::error::No Android SDK build-tools directory (ANDROID_SDK_ROOT='${ANDROID_SDK_ROOT:-}' ANDROID_HOME='${ANDROID_HOME:-}')"
            exit 1
          fi
          # Highest installed version that actually ships apksigner, so a
          # partially installed or file entry in build-tools cannot break signing.
          version=""
          while IFS= read -r candidate; do
            if [ -x "$sdk_root/build-tools/$candidate/apksigner" ]; then
              version="$candidate"
              break
            fi
          done < <(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -Vr)
          if [ -z "$version" ]; then
            echo "::error::No build-tools directory under $sdk_root/build-tools contains apksigner"
            exit 1
          fi
          echo "Signing with build-tools $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Sign Android release
        id: sign_app
        uses: r0adkll/sign-android-release@d5f8436b702872ad5cdb1e6e4d5c8b983d25a997
        with:
          # The directory to find your release to sign
          releaseDirectory: app/build/outputs/apk/prod/release
          # The key used to sign your release in base64 encoded format
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          # The key alias
          alias: ${{ secrets.ALIAS }}
          # The password to the keystore
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        env:
          # sign-android-release defaults to a hard-coded build-tools version;
          # use the one resolved from the installed SDK above.
          BUILD_TOOLS_VERSION: ${{ steps.build_tools.outputs.version }}
      - name: Rename release
        run: mv app/build/outputs/apk/prod/release/app-prod-release-unsigned-signed.apk neurhome-${{steps.bump_and_tag.outputs.new_tag}}.apk
      - name: Generate release checksum
        run: sha256sum neurhome-${{steps.bump_and_tag.outputs.new_tag}}.apk > neurhome-${{steps.bump_and_tag.outputs.new_tag}}.apk.sha256
      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: neurhome-prod-release
          path: |
            neurhome-${{steps.bump_and_tag.outputs.new_tag}}.apk
            neurhome-${{steps.bump_and_tag.outputs.new_tag}}.apk.sha256
          retention-days: 90
      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{steps.bump_and_tag.outputs.new_tag}}
          files: |
            neurhome-${{steps.bump_and_tag.outputs.new_tag}}.apk
            neurhome-${{steps.bump_and_tag.outputs.new_tag}}.apk.sha256
