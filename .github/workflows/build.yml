name: Build

# Least privilege by default; the build/release job opts into contents: write
# below so it can push the build tag and create the GitHub release.
permissions:
  contents: read

on:
  push:
    branches:
      - 'main'
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Bump version and push tag
        id: bump_and_tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # if you don't want to set write permissions use a PAT token
          WITH_V: false
          PRERELEASE: true
          PRERELEASE_SUFFIX: build
          INITIAL_VERSION: 1.0.0

      - name: Set Up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          # Must match gradle/gradle-daemon-jvm.properties (JETBRAINS 21); see pr.yml.
          java-version: 21
          distribution: jetbrains

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Assemble APK
        run: |
              ./gradlew \
                -Pandroid.versionName=${{steps.bump_and_tag.outputs.new_tag}} \
                assembleProdRelease

      - name: Sign Android release
        id: sign_app
        uses: r0adkll/sign-android-release@d5f8436b702872ad5cdb1e6e4d5c8b983d25a997
        with:
          # The directory to find your release to sign
          releaseDirectory: app/build/outputs/apk/prod/release
          # The key used to sign your release in base64 encoded format
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          # The key alias
          alias: ${{ secrets.ALIAS }}
          # The password to the keystore
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
      - name: Rename release
        run: mv app/build/outputs/apk/prod/release/app-prod-release-unsigned-signed.apk neurhome-${{steps.bump_and_tag.outputs.new_tag}}.apk
      - name: Generate release checksum
        run: sha256sum neurhome-${{steps.bump_and_tag.outputs.new_tag}}.apk > neurhome-${{steps.bump_and_tag.outputs.new_tag}}.apk.sha256
      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: neurhome-prod-release
          path: |
            neurhome-${{steps.bump_and_tag.outputs.new_tag}}.apk
            neurhome-${{steps.bump_and_tag.outputs.new_tag}}.apk.sha256
          retention-days: 90
      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{steps.bump_and_tag.outputs.new_tag}}
          files: |
            neurhome-${{steps.bump_and_tag.outputs.new_tag}}.apk
            neurhome-${{steps.bump_and_tag.outputs.new_tag}}.apk.sha256
