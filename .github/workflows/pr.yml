name: PR

# Least privilege by default; only the automerge job opts into the writes it
# needs (declared on that job below).
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

# Superseded runs on the same ref cancel each other instead of queuing up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Paths that cannot affect the Android build (docs/**, **/*.md, tools/**,
  # LICENSE, .github/dependabot.yml) are ignored for the heavy job below;
  # tools/** instead runs in the python-tests job. This paths-ignore filter is
  # applied at the job level rather than on
  # `on.pull_request`, because a workflow-level filter never reports a check for
  # docs-only PRs, leaving required checks pending and branch protection stuck.
  changes:
    name: Detect build-relevant changes
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.paths_ignore.outputs.build_needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Apply paths-ignore filter
        id: paths_ignore
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ] || [ -z "$head" ]; then
            # workflow_dispatch: no comparison range, always build.
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          build_needed=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/*|*.md|tools/*|LICENSE|.github/dependabot.yml) ;;
              *)
                build_needed=true
                break
                ;;
            esac
          done < <(git diff --name-only "$base" "$head")
          echo "build_needed=$build_needed" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.build_needed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      # Shared with build.yml. The action pins the JETBRAINS 21 JDK that
      # gradle/gradle-daemon-jvm.properties requires; the checkout above cannot
      # move into it, because a local composite action is only resolvable after
      # the repository is on the runner.
      - name: Set Up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle

      - name: Assemble, test and lint
        # One Gradle invocation keeps a single configuration/daemon warm and
        # lets the tasks run in parallel; CI pins a stable dev host suffix so dev
        # outputs are cacheable across machines.
        run: ./gradlew :app:assembleDevDebug :app:testDevDebugUnitTest :app:lintDevDebug --parallel -PdevHostSuffix=ci

      - name: Verify Room schema export is committed
        # KSP runs `room { schemaDirectory(...) }` during the build above, so a
        # database version bump whose generated schema JSON was not committed
        # surfaces here. `git status --porcelain` is used instead of
        # `git diff --exit-code` on purpose: a new schema version is a *new*
        # file, which `git diff` alone would not report. This check is only
        # meaningful because the step above runs KSP.
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain -- app/schemas)"
          if [ -n "$dirty" ]; then
            echo "::error::app/schemas is not committed - commit the schema export this build produced:"
            echo "$dirty"
            exit 1
          fi

      - name: Generate APK checksum
        run: |
          cd app/build/outputs/apk/dev/debug
          sha256sum app-dev-debug.apk > app-dev-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: neurhome-dev-debug
          path: |
            app/build/outputs/apk/dev/debug/app-dev-debug.apk
            app/build/outputs/apk/dev/debug/app-dev-debug.apk.sha256
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: neurhome-lint-report
          path: app/build/reports/lint-results-devDebug.html
          retention-days: 14
          if-no-files-found: ignore

      - name: Generate coverage report
        # Kover is applied in app/build.gradle.kts without any verification rule,
        # so this step has no threshold to fail on. Set a threshold from the
        # baseline measured in the uploaded report, then make this blocking by
        # removing continue-on-error.
        continue-on-error: true
        run: ./gradlew :app:koverXmlReportDevDebug :app:koverHtmlReportDevDebug --parallel -PdevHostSuffix=ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: neurhome-coverage-report
          path: |
            app/build/reports/kover/reportDevDebug.xml
            app/build/reports/kover/htmlDevDebug
          retention-days: 14
          if-no-files-found: ignore

  # Emulator smoke test for the instrumented suite (`:app:connectedDevDebugAndroidTest`),
  # which nothing else in CI runs. Deliberately NON-BLOCKING: emulator jobs are
  # the flakiest thing in CI, so this job is not a required check, is not part of
  # `required-checks`' `needs`, and cannot fail a PR until it has proven stable.
  # To make it required later: drop `continue-on-error`, add it to the
  # `required-checks` `needs` list and to that job's result check, then add
  # "PR / Instrumented tests (emulator)" to branch protection.
  instrumented-tests:
    name: Instrumented tests (emulator)
    needs: changes
    # Same paths-ignore filter as `build`: a docs-only PR must not pay for a
    # ~10 minute emulator boot.
    if: needs.changes.outputs.build_needed == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Set Up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle

      - name: Enable KVM
        # The runner exposes /dev/kvm but only for the kvm group; without this
        # the emulator falls back to software emulation and times out.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on an API 34 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # minSdk is 34, so 34 is the lowest image the suite can run on.
          api-level: 34
          target: google_apis
          # The action defaults to x86, which has no API 34 image.
          arch: x86_64
          # Compose tests assert on settled animations, and the T9 keyboard tests
          # drive text fields, so disable both sources of timing flakiness.
          disable-animations: true
          disable-spellchecker: true
          script: |
            set -euo pipefail
            # A sleeping or locked device makes every Compose test fail with
            # "No compose hierarchies found in the app" (AGENTS.md).
            adb shell svc power stayon true
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard || true
            # Same stable dev host suffix as the `build` job, so the dev variant
            # the emulator installs is the cacheable one.
            ./gradlew :app:connectedDevDebugAndroidTest -PdevHostSuffix=ci

  # Python tooling tests (tools/tests) are not part of the Android build and are
  # therefore not covered by the `build` job, which skips tools-only changes.
  python-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          # The eval scripts' pinned dependencies; keyed on that file so the pip
          # cache is only reused while they are unchanged.
          cache-dependency-path: tools/requirements-home-selection-eval.txt

      - name: Install dependencies
        # pytest is pinned here rather than in the eval requirements file, which
        # describes the eval scripts' runtime only.
        run: python -m pip install -r tools/requirements-home-selection-eval.txt pytest==9.1.1

      - name: Run tools tests
        run: python -m pytest tools/tests

  # Always-on required check. Branch protection should require
  # "PR / required-checks": unlike `build`, which is skipped for docs-only PRs,
  # this job always runs and reports, so the required check is never left
  # pending; it fails only when the Android build really failed.
  required-checks:
    name: required-checks
    needs:
      - changes
      - build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the Android build did not fail
        run: |
          changes_result="${{ needs.changes.result }}"
          build_result="${{ needs.build.result }}"
          if [ "$changes_result" = "failure" ] || [ "$changes_result" = "cancelled" ]; then
            echo "Change detection $changes_result"
            exit 1
          fi
          if [ "$build_result" = "failure" ] || [ "$build_result" = "cancelled" ]; then
            echo "Android build $build_result"
            exit 1
          fi
          echo "Android build result: $build_result"

  automerge:
    needs: build
    # Dependabot PRs only. Without this guard the job starts a runner for every
    # human PR just to log "Not a dependabot PR, skipping"; skipping at the job
    # level avoids that wasted run and keeps the PR check list clean.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: write

    steps:
      - uses: fastify/github-action-merge-dependabot@73ec4cbb5e56df5591eae286972d5b2201ffe90f # v3
        with:
          github-token: ${{ secrets.DEPENDABOT_TOKEN }}
