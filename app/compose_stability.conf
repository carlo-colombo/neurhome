// Types this app never mutates after construction, but that the Compose compiler cannot prove
// stable on its own because they hold platform values: Application.icon is an Any? Drawable,
// Application.intent an Intent, Application.appInfo a LauncherActivityInfo. Listing a type here
// promises the compiler it is stable, so composables taking it compare values with `equals`
// instead of falling back to instance comparison.
// See https://developer.android.com/develop/ui/compose/performance/stability/fix#configuration-file
ovh.litapp.neurhome3.data.Application
