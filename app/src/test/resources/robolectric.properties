# KNOWN CONSTRAINT: the JVM test stack runs on API 34 (minSdk) while the app compiles against and
# targets API 37. The API 34 android-all runtime is cached locally, which keeps Robolectric tests
# offline and fast, so this divergence is a deliberate trade rather than an oversight.
# Consequence: nothing in `:app:testDevDebugUnitTest` covers API 35+ runtime behaviour - notably the
# enforced edge-to-edge that API 35+ applies to apps targeting it - so an API 35+ behaviour change
# must be validated by an instrumented device/emulator run, not by the JVM suite.
# Remove this pin once API 37 artifacts are cached too.
sdk=34
