# The JVM test stack runs on the same API the app compiles against and targets (37), so the suite
# covers API 35+ runtime behaviour - notably the enforced edge-to-edge that applies to apps
# targeting it. The runtime is not fetched while a test initialises: the Gradle build declares
# `androidAllInstrumented` in gradle/libs.versions.toml, stages that jar through
# `copyRobolectricAndroidAll` and runs Robolectric with `robolectric.offline=true` against it. The
# declared version must keep tracking this pin, or every Robolectric test fails with
# "Unable to locate dependency": Robolectric 4.17's DefaultSdkProvider maps API 37 to
# android-all-instrumented android version "17" / revision "15733970". Bump both together.
# ShadowPaintHasGlyph is global (not per-test @Config) because API 37's label visibility check uses
# Paint.hasGlyph, which no Robolectric runtime can answer without a font stack.
shadows=ovh.litapp.neurhome3.ShadowPaintHasGlyph
sdk=37
