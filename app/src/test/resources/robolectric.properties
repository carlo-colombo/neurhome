# KNOWN CONSTRAINT: the JVM test stack runs on API 34 (minSdk) while the app compiles against and
# targets API 37. The API 34 android-all runtime is not fetched while a test initialises: the Gradle
# build declares `androidAllInstrumented` in gradle/libs.versions.toml, stages that jar through
# `copyRobolectricAndroidAll` and runs Robolectric with `robolectric.offline=true` against it. The
# declared version must keep tracking this pin, or every Robolectric test fails with
# "Unable to locate dependency".
# Consequence: nothing in `:app:testDevDebugUnitTest` covers API 35+ runtime behaviour - notably the
# enforced edge-to-edge that API 35+ applies to apps targeting it - so an API 35+ behaviour change
# must be validated by an instrumented device/emulator run, not by the JVM suite.
# Remove this pin once an API 37 runtime is staged the same way.
sdk=34
