[versions]
accompanist = "0.37.3"
# Robolectric's SDK 34 runtime. Must stay in lockstep with the `sdk=34` pin in
# app/src/test/resources/robolectric.properties: Robolectric 4.17's DefaultSdkProvider maps API 34 to
# android-all-instrumented android version "14" / revision "10818077" (the "i7" is the instrumented
# jar revision). app/build.gradle.kts stages exactly this artifact so the unit tests never fetch it
# from Maven while a sandbox initialises.
androidAllInstrumented = "14-robolectric-10818077-i7"
activityCompose = "1.13.0"
androidGradlePlugin = "9.4.1"
androidxComposeBom = "2026.09.00"
appcompatResources = "1.8.0"
benchmarkMacroJunit4 = "1.5.0"
coreKtx = "1.19.1"
coroutinesTest = "1.11.0"
datastore-preferences = "1.2.1"
espressoCore = "3.7.0"
geohash = "1.4.0"
junit = "4.13.2"
junitVersion = "1.3.0"
kotlin = "2.4.21"
kover = "0.9.11"
ktor = "3.6.0"
ksp = "2.3.12"
lifecycleLivedataKtx = "2.11.0"
navigationCompose = "2.10.2"
profileinstaller = "1.4.1"
robolectric = "4.17"
room = "2.8.5"
turbine = "1.2.1"
uiautomator = "2.4.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = {id="com.google.devtools.ksp", version.ref = "ksp"}
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
room = {id="androidx.room", version.ref="room"}

[libraries]

accompanist-drawablePainter = {group="com.google.accompanist", name="accompanist-drawablepainter", version.ref = "accompanist"}
accompanist-permissions = {group="com.google.accompanist", name="accompanist-permissions", version.ref = "accompanist"}
android-all-instrumented = { module = "org.robolectric:android-all-instrumented", version.ref = "androidAllInstrumented" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-appcompat-resources = { module = "androidx.appcompat:appcompat-resources", version.ref = "appcompatResources" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmarkMacroJunit4" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore-preferences" }
androidx-datastore-preferences-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "datastore-preferences" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "junitVersion" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycleLivedataKtx" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleLivedataKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleLivedataKtx" }
androidx-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-material3 = { module = "androidx.compose.material3:material3" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-ui = { module = "androidx.compose.ui:ui" }
androidx-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
geohash = { module = "ch.hsr:geohash", version.ref = "geohash" }
junit = { module = "junit:junit", version.ref = "junit" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version = "1.11.0" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
