pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "Neurhome3"
include ':app'
// Records Baseline Profiles for the app on a device. It is not part of the app build:
// nothing depends on :baselineprofile and it produces no committed output. See
// baselineprofile/README.md.
include ':baselineprofile'
